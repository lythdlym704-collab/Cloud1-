name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Folders Structure
        run: |
          # ترتيب المجلدات تلقائياً (نقل ملفات lib و public)
          mkdir -p lib public
          mv -f analyzer.js builder.js png.js sdk.js zip.js lib/ 2>/dev/null || true
          mv -f index.html style.css app.js icon.svg public/ 2>/dev/null || true

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Compile and Generate APK
        run: |
          node -e '
            const path = require("path");
            const fs = require("fs");
            const { buildApk } = require("./lib/builder");

            async function start() {
              console.log("بدء تجميع التطبيق...");
              const config = {
                mode: "web",
                appName: "تطبيقي",
                packageName: "com.lyth.app",
                versionName: "1.0",
                versionCode: 1,
                permissions: ["VIBRATE", "INTERNET"],
                html: fs.readFileSync("./public/index.html", "utf8")
              };

              const dataDir = path.resolve("./.data");
              fs.mkdirSync(dataDir, { recursive: true });

              const res = await buildApk(config, {
                dataDir: dataDir,
                log: (msg) => console.log(msg)
              });

              fs.mkdirSync("./output", { recursive: true });
              fs.copyFileSync(res.apkPath, "./output/app-release.apk");
              console.log("تم إنشاء الـ APK بنجاح!");
            }

            start().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
