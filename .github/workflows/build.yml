name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install

      - name: Trigger Build via Server
        run: |
          # تشغيل خادم التطبيق سحابياً
          npm start &
          sleep 6

          # إرسال أمر بناء ملف APK
          echo "جاري إرسال طلب البناء..."
          BUILD_RESP=$(curl -s -X POST http://localhost:3000/api/build \
            -H "Content-Type: application/json" \
            -d '{
              "mode": "web",
              "appName": "تطبيقي",
              "packageName": "com.lyth.app",
              "versionName": "1.0",
              "versionCode": 1,
              "permissions": ["VIBRATE", "INTERNET"],
              "html": "<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><title>تطبيقي</title></head><body style=\"display:grid;place-items:center;min-height:100vh;margin:0;font-family:sans-serif;background:#eef2ff\"><h1>تم بناء التطبيق بنجاح 🎉</h1></body></html>"
            }')
          
          JOB_ID=$(echo "$BUILD_RESP" | grep -o '"id":"[^"]*' | cut -d'"' -f4)
          echo "معرّف عملية البناء: $JOB_ID"

          if [ -z "$JOB_ID" ]; then
            echo "فشل إرسال الطلب: $BUILD_RESP"
            exit 1
          fi

          # انتظار انتهاء السيرفر من تجميع ملف الـ APK وتحميله
          mkdir -p output
          for i in {1..40}; do
            STATUS_RESP=$(curl -s "http://localhost:3000/api/jobs/$JOB_ID")
            STATUS=$(echo "$STATUS_RESP" | grep -o '"status":"[^"]*' | cut -d'"' -f4)
            echo "الحالة الحالية: $STATUS"
            
            if [ "$STATUS" == "done" ]; then
              echo "نجح البناء! جاري سحب الـ APK..."
              curl -s -o output/app-release.apk "http://localhost:3000/api/jobs/$JOB_ID/apk"
              break
            elif [ "$STATUS" == "failed" ]; then
              echo "فشل البناء الداخلي!"
              echo "$STATUS_RESP"
              exit 1
            fi
            sleep 2
          done

          if [ ! -f "output/app-release.apk" ]; then
            echo "الملف لم يتم تنزيله!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
